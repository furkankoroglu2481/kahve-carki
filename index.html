<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karar Çarkı ☕</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            background-color: #0d070f;
            overflow-x: hidden;
        }

        /* --- ARKA PLAN ÇİFT GÖRSEL YAPISI --- */
        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            z-index: -1;
            pointer-events: none;
        }

        /* Sol Taraf Görseli (bg2.jpg) */
        .bg-left {
            width: 50%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            filter: brightness(0.85);
            background-color: #111; /* Resim yüklenene kadar siyah ekran yerine koyu ton */
        }

        /* Sağ Taraf Görseli (bg.jpg) */
        .bg-right {
            width: 50%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            filter: brightness(0.85);
            background-color: #111;
        }

        /* --- İÇERİK TASARIMI --- */
        .header { 
            text-align: center; 
            margin-bottom: 15px; 
            text-shadow: 0 2px 8px rgba(0,0,0,0.9);
            background: rgba(0, 0, 0, 0.65);
            padding: 10px 22px;
            border-radius: 15px;
            backdrop-filter: blur(6px);
            z-index: 2;
        }
        .header h1 { font-size: 22px; color: #f39c12; margin-bottom: 4px; }
        .header p { font-size: 13px; color: #ffffff; }

        .wheel-wrapper {
            position: relative;
            width: 280px;
            height: 280px;
            margin-bottom: 20px;
            z-index: 2;
        }
        .arrow {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 0; height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-top: 20px solid #e74c3c;
            z-index: 10;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
        }
        
        canvas {
            width: 100%; height: 100%;
            border-radius: 50%;
            box-shadow: 0 8px 30px rgba(0,0,0,0.8);
        }

        .center-cap {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 42px;
            height: 42px;
            background: rgba(44, 62, 80, 0.9);
            border: 3px solid #f39c12;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            box-shadow: 0 0 12px rgba(0,0,0,0.6);
            z-index: 5;
        }

        .spin-btn {
            background: rgba(230, 126, 34, 0.95); 
            color: white; border: none;
            padding: 12px 30px; font-size: 15px; font-weight: bold;
            border-radius: 30px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
            transition: all 0.2s ease;
            backdrop-filter: blur(3px);
            z-index: 2;
        }
        .spin-btn:hover { background: #d35400; transform: scale(1.05); }
        .spin-btn:disabled { background: rgba(127, 140, 141, 0.85); cursor: not-allowed; transform: scale(1); }
        
        /* MOBİL VE TABLET UYUMU */
        @media (max-width: 768px) {
            .bg-container {
                flex-direction: column;
            }
            .bg-left, .bg-right {
                width: 100%;
                height: 50%;
            }
            .wheel-wrapper {
                width: 250px;
                height: 250px;
            }
        }

        .modal {
            display: none; position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            justify-content: center; align-items: center; z-index: 100;
        }
        .modal-card {
            background: #2c3e50; padding: 30px; border-radius: 20px;
            text-align: center; max-width: 350px; width: 85%;
            border: 2px solid #f39c12;
            animation: popup 0.4s ease-out;
        }
        @keyframes popup {
            from { transform: scale(0.7); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .modal-card h2 { color: #2ecc71; font-size: 22px; margin-bottom: 12px; }
        .modal-card p { font-size: 16px; line-height: 1.5; color: #ecf0f1; margin-bottom: 15px; }

        .countdown-text {
            font-size: 13px;
            color: #f39c12;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .modal-card button {
            background: #2ecc71; color: white; border: none;
            padding: 12px 28px; font-size: 15px; font-weight: bold;
            border-radius: 10px; cursor: pointer;
            transition: background 0.2s;
        }
        .modal-card button:hover { background: #27ae60; }
    </style>
</head>
<body>

    <!-- Arka Plan: Sol Taraf bg2.jpg, Sağ Taraf bg.jpg -->
    <div class="bg-container">
        <img src="bg2.jpg" class="bg-left" alt="Sol Arka Plan">
        <img src="bg.jpg" class="bg-right" alt="Sağ Arka Plan">
    </div>

    <div class="header">
        <h1>Kahve Teklifi Karar Çarkı ☕</h1>
        <p>Kaderinde ne var? Çarkı çevir ve kararını ver!</p>
    </div>

    <div class="wheel-wrapper">
        <div class="arrow"></div>
        <canvas id="wheel" width="400" height="400"></canvas>
        <div class="center-cap">☕</div>
    </div>

    <button class="spin-btn" id="spinBtn" onclick="spin()">Çarkı Çevir 🎲</button>

    <div class="modal" id="resultModal">
        <div class="modal-card">
            <h2>Kader Konuştu! 🎉</h2>
            <p id="resultText">Evet, bir kahve içmek istiyorum ☕</p>
            <div class="countdown-text" id="countdown">Kader belirlendi! <span id="timer">3</span> saniye içinde WhatsApp'a aktarılıyorsun...</div>
            <button id="locBtn" onclick="sendWhatsappMessage()">Haydi kahve içmeye gidelim! ☕</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('wheel');
        const ctx = canvas.getContext('2d');
        const spinBtn = document.getElementById('spinBtn');

        const slices = [
            { text: "Evet, kahve içelim ☕", color: "rgba(46, 204, 113, 0.4)" },
            { text: "Başka zaman söz 🙈", color: "rgba(231, 76, 60, 0.35)" },
            { text: "Çok yoğunum valla 😅", color: "rgba(192, 57, 43, 0.35)" },
            { text: "Bugün modumda değilim 🤐", color: "rgba(231, 76, 60, 0.35)" },
            { text: "Diyet yapıyorum ☕❌", color: "rgba(192, 57, 43, 0.35)" },
            { text: "Kaderimiz bu değilmiş 💔", color: "rgba(231, 76, 60, 0.35)" },
            { text: "Kahve beni çarpar ⚡", color: "rgba(192, 57, 43, 0.35)" },
            { text: "Evden çıkasım yok 🛌", color: "rgba(231, 76, 60, 0.35)" }
        ];

        const numSlices = slices.length;
        const sliceAngle = (2 * Math.PI) / numSlices;
        let currentAngle = 0;
        let isSpinning = false;
        let lastSliceIndex = -1;

        // --- SES EFEKTİ MOTORU ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playClickSound() {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.04);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.04);
        }

        // --- LOCALSTORAGE KONTROLÜ ---
        if (localStorage.getItem('wheelSpun') === 'true') {
            spinBtn.disabled = true;
            spinBtn.innerText = "Kader kararını verdi! ☕";
        }

        function drawWheel() {
            const radius = canvas.width / 2;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            slices.forEach((slice, i) => {
                const angle = currentAngle + i * sliceAngle;
                
                ctx.beginPath();
                ctx.moveTo(radius, radius);
                ctx.arc(radius, radius, radius, angle, angle + sliceAngle);
                ctx.fillStyle = slice.color;
                ctx.fill();
                
                ctx.lineWidth = 1.5;
                ctx.strokeStyle = "rgba(255, 255, 255, 0.35)";
                ctx.stroke();

                ctx.save();
                ctx.translate(radius, radius);
                ctx.rotate(angle + sliceAngle / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#ffffff"; 
                
                ctx.shadowColor = "rgba(0, 0, 0, 0.95)";
                ctx.shadowBlur = 5;
                ctx.shadowOffsetX = 1;
                ctx.shadowOffsetY = 1;
                
                ctx.font = "bold 13.5px sans-serif";
                ctx.fillText(slice.text, radius - 18, 5);
                ctx.restore();
            });
        }

        drawWheel();

        function spin() {
            if (isSpinning || localStorage.getItem('wheelSpun') === 'true') return;
            isSpinning = true;
            spinBtn.disabled = true;

            const fullRounds = 5;
            const edgeBoundaryAngle = (3 * Math.PI / 2) - sliceAngle + 0.02;
            const fakeStopAngle = (fullRounds * 2 * Math.PI) + edgeBoundaryAngle;
            const microShift = 0.06; 

            let start = null;
            const mainDuration = 3800; 

            function animate(timestamp) {
                if (!start) start = timestamp;
                const progress = (timestamp - start) / mainDuration;

                if (progress < 1) {
                    const easeOut = 1 - Math.pow(1 - progress, 3);
                    currentAngle = easeOut * fakeStopAngle;

                    const currentSliceIndex = Math.floor((currentAngle % (2 * Math.PI)) / sliceAngle);
                    if (currentSliceIndex !== lastSliceIndex) {
                        playClickSound();
                        lastSliceIndex = currentSliceIndex;
                    }

                    drawWheel();
                    requestAnimationFrame(animate);
                } else {
                    currentAngle = fakeStopAngle;
                    drawWheel();

                    setTimeout(() => {
                        let shiftStart = null;
                        const shiftDuration = 300;

                        function shiftAnimate(shiftTimestamp) {
                            if (!shiftStart) shiftStart = shiftTimestamp;
                            const shiftProgress = (shiftTimestamp - shiftStart) / shiftDuration;

                            if (shiftProgress < 1) {
                                currentAngle = fakeStopAngle + (shiftProgress * microShift);
                                drawWheel();
                                requestAnimationFrame(shiftAnimate);
                            } else {
                                currentAngle = fakeStopAngle + microShift;
                                drawWheel();
                                isSpinning = false;
                                localStorage.setItem('wheelSpun', 'true');
                                spinBtn.innerText = "Kader kararını verdi! ☕";
                                showResult();
                            }
                        }
                        requestAnimationFrame(shiftAnimate);
                    }, 700);
                }
            }
            requestAnimationFrame(animate);
        }

        function showResult() {
            confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
            document.getElementById('resultModal').style.display = 'flex';

            let seconds = 3;
            const timerElement = document.getElementById('timer');
            const countdownInterval = setInterval(() => {
                seconds--;
                if (seconds >= 0) {
                    timerElement.innerText = seconds;
                }
                if (seconds === 0) {
                    clearInterval(countdownInterval);
                    sendWhatsappMessage();
                }
            }, 1000);
        }

        // --- WHATSAPP YÖNLENDİRME ---
        function sendWhatsappMessage() {
            const phone = "905419579256";
            const text = encodeURIComponent("Çark kaderimi belirledi, kahve teklifini kabul ediyorum! ☕");
            
            window.location.href = `https://wa.me/${phone}?text=${text}`;
        }
    </script>
</body>
</html>
